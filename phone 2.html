function callTaxi(){
  const ko=L!=='zh';
  if(taxiOn){toast(ko?'이미 택시가 배차되었습니다':'行程进行中');return;}
  if(document.getElementById('taxiOk'))return;
  const from=($('#taxiFrom')?.value||'').trim();
  const to=($('#taxiTo')?.value||'').trim();
  if(!from||!to){toast(ko?'출발지와 도착지를 입력해 주세요':'请输入出发地和到达地');return;}
  const btn=$('#taxiBtn'), st=$('#taxiStatus');
  if(btn){btn.disabled=true; btn.textContent=ko?'배차 중…':'派车中…';}
  if(st) st.textContent=ko?'근처 택시를 찾고 있습니다…':'正在寻找附近的出租车…';
  clearTimeout(taxiTimer);
  taxiOn=true;
  const delay=1000+Math.random()*2000;
  taxiTimer=setTimeout(()=>{
    if(btn){btn.disabled=true; btn.textContent=ko?'운행 중':'行程中';}
    if(st) st.textContent=ko?`🚕 ${from} → ${to}`:`🚕 ${from} → ${to}`;
    let icon=$('#taxiIcon');
    if(icon){
      icon.style.display='block';
      icon.style.transition='left 0.05s linear, top 0.05s linear';
      // start position (bottom-left-ish)
      let x=12, y=70;
      icon.style.left=x+'%';
      icon.style.top=y+'%';
      // animate to destination over 7-10 seconds
      const duration=7000+Math.random()*3000;
      const targetX=72+Math.random()*12;
      const targetY=18+Math.random()*15;
      const t0=Date.now();
      function moveStep(){
        if(!taxiOn){return;}
        const p=Math.min(1,(Date.now()-t0)/duration);
        const ease=p*p*(3-2*p);
        const cx=x+(targetX-x)*ease;
        const cy=y+(targetY-y)*ease;
        if(icon){icon.style.left=cx+'%';icon.style.top=cy+'%';}
        if(p<1){
          taxiTimer=setTimeout(moveStep, 40);
        } else {
          if(st) st.textContent=ko?'목적지에 도착했습니다':'已到达目的地';
          setTimeout(()=>{ endTaxi(true); }, 600);
        }
      }
      moveStep();
    } else {
      // fallback auto-end
      taxiTimer=setTimeout(()=>endTaxi(true), 8000);
    }
    document.getElementById('taxiOk')?.remove();
    const m=document.createElement('div');m.className='sheet';m.id='taxiOk';
    m.innerHTML=`<div class="shb" style="background:#fff;border-radius:20px 20px 0 0;padding:24px 20px;text-align:center">
      <div style="font-size:40px;margin-bottom:8px">🚕</div>
      <div style="font-size:18px;font-weight:700;margin-bottom:6px">${ko?'택시 배차 완료':'出租车呼叫成功'}</div>
      <div style="font-size:13px;color:#666;margin-bottom:12px">${E(from)} → ${E(to)}</div>
      <div style="font-size:12px;color:#999;margin-bottom:18px">${ko?'차량이 이동 중입니다':'车辆行驶中'}</div>
      <button class="appbtn" style="width:100%;padding:12px;background:#34c759;color:#fff;border:0;border-radius:10px;font-weight:700" onclick="document.getElementById('taxiOk')?.remove()">${ko?'확인':'确认'}</button>
    </div>`;
    document.getElementById('phone').appendChild(m);
  }, delay);
}

function endTaxi(auto){
  const ko=L!=='zh';
  taxiOn=false;
  clearTimeout(taxiTimer); taxiTimer=null;
  const icon=$('#taxiIcon'); if(icon){icon.style.display='none';}
  document.querySelectorAll('#taxiOk').forEach(e=>e.remove());
  const btn=$('#taxiBtn'),st=$('#taxiStatus');
  if(btn){btn.disabled=false;btn.textContent=ko?'택시 호출하기':'呼叫出租车';btn.style.background='#111';}
  if(st)st.textContent=auto?(ko?'운행이 종료되었습니다':'行程已结束'):'';
  if(!auto) toast(ko?'택시 운행이 종료되었습니다':'出租车行程已结束');
  else toast(ko?'목적 도착 · 운행 종료':'已到达 · 行程结束');
}

 };
 function bmStoreCards(stores){return stores.map(st=>`<div class="bm-storecard" onclick="bmOpenStore('${st.id}')"><div class="bm-storephoto">${st.category==='치킨'?'🍗':st.category==='피자'?'🍕':'🍱'}${st.discount?`<i>${st.discount}</i>`:''}</div><div class="bm-storeinfo"><b>${st.name}</b><p>⭐ ${st.rating} (${st.reviews.toLocaleString()}) · ${st.min}~${st.max}분</p><p>${st.fee?'배달팁 '+bmMoney(st.fee):'한그릇 무료배달'} · 최소주문 ${bmMoney(15000)}</p><small>${st.tag}</small></div><button class="bm-heart" onclick="event.stopPropagation();bmToggleFav('${st.id}');renderBaemin()">${bmFav.has(st.id)?'♥':'♡'}</button></div>`).join('')}

 window.bmGo=function(p){bmPage=p;renderBaemin()};window.bmChooseCategory=function(c){bmCategory=c;bmPage='category';renderBaemin()};window.bmSearchGo=function(){const q=($('#bmSearch')?.value||'').trim();const found=CONFIG.baemin.stores.find(s=>s.name.toLowerCase().includes(q.toLowerCase())||s.category.includes(q));if(found){bmStore=found.id;bmPage='store'}else{bmCategory=q||'치킨';bmPage='category'}renderBaemin()};window.bmOpenStore=function(id){bmStore=id;bmPage='store';renderBaemin()};window.bmOpenProduct=function(sid,pid){bmStore=sid;bmProduct=pid;bmDrink='미제공';bmQty=1;bmPage='product';renderBaemin()};window.bmToggleFav=function(id){bmFav.has(id)?bmFav.delete(id):bmFav.add(id);bmToast(bmFav.has(id)?'찜한 가게에 추가했어요':'찜한 가게에서 삭제했어요')};window.bmAddCart=function(){const st=bmStoreObj(),m=bmMenu(),drink=bmDrink,price=m.price+bmDrinkPrice();const old=bmCart.find(x=>x.id===m.id&&x.drink===drink);if(old)old.qty+=bmQty;else bmCart.push({id:m.id,name:m.name,desc:m.desc,emoji:m.emoji,price,qty:bmQty,drink,store:st.id,storeName:st.name});bmPage='cart';renderBaemin();bmToast('장바구니에 담았어요')};window.bmChangeQty=function(i,d){if(!bmCart[i])return;bmCart[i].qty+=d;if(bmCart[i].qty<=0)bmCart.splice(i,1);renderBaemin()};window.bmEditItem=function(i){const x=bmCart[i];if(!x)return;bmStore=CONFIG.baemin.stores.find(s=>s.id===x.store)?.id||'bhc';bmProduct=x.id;bmDrink=x.drink;bmQty=x.qty;bmCart.splice(i,1);bmPage='product';renderBaemin()};window.bmAddExtra=function(n){const prices={'치즈볼':5000,'감자튀김':4000,'치킨무':1000};bmCart.push({id:'extra-'+n,name:n,desc:'추가 메뉴',emoji:'🍽️',price:prices[n],qty:1,drink:'미제공',store:bmStoreObj().id,storeName:bmStoreObj().name});renderBaemin()};window.bmClearCart=function(){if(!bmCart.length)return;bmCart=[];renderBaemin()};window.bmEditAddress=function(){const sh=document.createElement('div');sh.className='sheet';sh.innerHTML=`<div class="shb"><h3 style="margin:12px 4px 18px">배달주소 변경</h3><input id="bmAddressInput" value="${bmAddress.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" style="width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:9px;font-size:14px"><button class="bm-modalbtn" style="margin-top:14px" onclick="const v=document.getElementById('bmAddressInput').value.trim();if(v)bmAddress=v;this.closest('.sheet').remove();renderBaemin()">주소 저장</button><button class="bm-modalclose" onclick="this.closest('.sheet').remove()">취소</button></div>`;P.appendChild(sh)};window.bmToast=function(msg){toast(msg)};window.bmMenuTab=function(el,tab){el.parentElement.querySelectorAll('span').forEach(x=>x.classList.remove('on'));el.classList.add('on');const st=bmStoreObj();document.querySelectorAll('.bm-menuitem').forEach((item,i)=>{item.style.display=tab==='인기메뉴'?(st.menus[i]?.badge?'flex':'none'):tab==='할인메뉴'?(st.menus[i]?.badge==='인기'?'flex':'none'):(i===st.menus.length-1?'flex':'none')})};window.bmSubmitOrder=function(){if(!bmCart.length)return bmToast('장바구니가 비어 있어요');if(!$('#bmAgree')?.checked)return bmToast('주문 동의 항목을 확인해 주세요');if(!bmPhone.trim())return bmToast('휴대폰 번호를 입력해 주세요');const order={id:'BM'+Date.now(),store:bmCart[0].storeName,items:bmCart.map(x=>`${x.name} × ${x.qty}`).join(', '),total:bmTotal(),status:'주문 접수',date:new Date().toLocaleString('ko-KR'),delivery:bmDeliveryObj().name,stage:0};bmOrders.push(order);bmCart=[];bmPage='orders';renderBaemin();bmShowOrderModal(order)};window.bmShowOrderModal=function(order){const sh=document.createElement('div');sh.className='sheet bm-order-sheet';sh.innerHTML=`<div class="shb"><div class="bm-modalmark">✓</div><h2>${bmT('주문 완료')}</h2><p>${order.store}에 주문이 전달됐어요.</p><div class="bm-progress"><div class="bm-progline"><i></i><i></i><i></i></div><div><b>주문 접수</b><small>가게에서 주문 확인 중</small></div><div><b>라이더 배정</b><small>잠시 후 배달이 시작돼요</small></div><div><b>배달 중</b><small>예상 도착까지 약 30분</small></div></div><div class="bm-countdown" id="bmCountdown">예상 배달 시간 30:00</div><button class="bm-modalbtn" onclick="this.closest('.sheet').remove();bmGo('orders')">주문내역 확인 <script>
/* Coupang local-only simulation. All temporary order/chat changes reset on refresh. */
(function(){
 const CP=CONFIG.coupang, $id=id=>document.getElementById(id);
 let page='home',category='전체',product=null,qty=1,option='',cart=[],payer='',payMethod='신용/체크카드';
 let address='서울특별시 강남구 테헤란로 123, 101동 1203호',phone='010-1234-5678';
 const txt=(ko,zh)=>L==='zh'?(zh||ko):ko, won=n=>'₩'+Number(n||0).toLocaleString('ko-KR');
 const products=()=>CP.products, getProd=id=>products().find(x=>x.id===id), total=()=>cart.reduce((a,x)=>a+x.price*x.qty,0);
 const root=()=>{let e=$id('coupangApp');if(!e)e=scr('coupangApp',`${SB('#111')}<div class="sc" id="cpRoot"></div>${HB('#111')}`,'lt');return e.querySelector('#cpRoot')};
 const style=document.createElement('style');style.textContent=`
 #coupangApp{background:#f4f6f8;color:#111}#coupangApp .sc{background:#f4f6f8;color:#111;padding-bottom:calc(var(--bot) + 18px)}
 .cp-top{position:sticky;top:0;z-index:4;background:#fff;padding:calc(var(--top) + 8px) 15px 12px;box-shadow:0 1px 4px #0000000d}.cp-search{height:42px;border:2px solid #346aff;border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#fff;color:#888}.cp-search input{border:0;outline:0;min-width:0;flex:1;font-size:14px;color:#111;background:transparent}
 .cp-content{padding:12px 12px 25px}.cp-chips{display:flex;gap:8px;overflow:auto;padding:10px 0 12px;scrollbar-width:none}.cp-chip{white-space:nowrap;border:1px solid #e1e4e8;background:#fff;border-radius:18px;padding:8px 12px;font-size:12px}.cp-chip.active{border-color:#346aff;color:#2458d8;background:#eef3ff}.cp-hero{background:linear-gradient(120deg,#dff1ff,#f8fbff);border-radius:14px;padding:15px;margin:5px 0 12px}.cp-rocket{color:#2457cf;font-size:11px;font-weight:800}
 .cp-card{background:#fff;border-radius:12px;padding:11px;margin:0 0 10px;display:flex;gap:11px;box-shadow:0 1px 2px #00000008}.cp-art{width:94px;min-width:94px;height:106px;border-radius:9px;background:linear-gradient(145deg,#f3f5f7,#e7edf3);display:flex;align-items:center;justify-content:center;font-size:44px}.cp-info{flex:1;min-width:0}.cp-info h3{font-size:14px;font-weight:500;line-height:1.4;margin:0 0 5px}.cp-price{font-size:18px;font-weight:800;margin:4px 0}.cp-old{color:#999;text-decoration:line-through;font-size:11px}.cp-rate{font-size:11px;color:#777;margin:5px 0}.cp-tag{display:inline-block;border-radius:4px;background:#e8f1ff;color:#2458d8;padding:3px 5px;font-size:10px;font-weight:700;margin-right:4px}.cp-btn{border:0;border-radius:8px;background:#346aff;color:white;padding:12px 14px;font-weight:700;font-size:14px}.cp-btn.light{background:#fff;color:#2458d8;border:1px solid #346aff}.cp-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #edf0f2}.cp-panel{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px}.cp-panel h3{font-size:15px;margin:0 0 10px}.cp-label,.cp-muted{font-size:12px;color:#68717d}.cp-muted{line-height:1.5}.cp-count{display:flex;align-items:center;gap:12px}.cp-count button{width:30px;height:30px;border:1px solid #d9dfe6;background:#fff;border-radius:7px;font-size:18px}.cp-bottom{position:sticky;bottom:calc(var(--bot) + 8px);background:#fff;padding:12px;border-radius:12px;box-shadow:0 -2px 10px #00000010;display:flex;align-items:center;gap:10px}.cp-modal{position:absolute;inset:0;z-index:999;background:#0006;display:flex;align-items:flex-end}.cp-sheet{width:100%;max-height:84%;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px calc(var(--bot) + 18px);color:#111}.cp-contact{display:flex;align-items:center;gap:12px;padding:13px 3px;border-bottom:1px solid #eee}.cp-avatar{width:42px;height:42px;border-radius:50%;background:#e5edf8;display:grid;place-items:center;font-size:19px}.cp-orderstate{font-size:12px;font-weight:800;color:#2458d8}.cp-tabbar{display:flex;justify-content:space-around;background:#fff;padding:12px 0;position:sticky;bottom:0;font-size:10px;color:#626b75}.cp-tabbar span{text-align:center;min-width:44px}.cp-tabbar b{display:block;font-size:19px;margin-bottom:3px;color:#222}.cp-option{display:block;padding:12px;border:1px solid #dfe4ea;border-radius:9px;margin:7px 0;font-size:13px}.cp-option.active{border:2px solid #346aff;background:#f3f7ff}.cp-input{width:100%;padding:12px;border:1px solid #d9dfe6;border-radius:8px;font-size:14px;box-sizing:border-box;background:#fff;color:#111}
 `;document.head.appendChild(style);
 function header(){return `<div class="cp-top"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><b style="font-size:21px;letter-spacing:-1px;color:#e31837">coupang</b><span style="font-size:11px;color:#536170">로켓배송 🚀</span></div><div class="cp-search"><span>⌕</span><input id="cpSearch" placeholder="${txt('쿠팡에서 찾고 싶은 상품을 검색하세요','搜索你想在 Coupang 购买的商品')}" oninput="cpSearchRender(this.value)"><span onclick="cpSearchRender(document.getElementById('cpSearch').value)">검색</span></div><div style="display:flex;gap:12px;overflow:auto;font-size:11px;margin-top:11px;white-space:nowrap"><span>🚀 로켓배송</span><span>💙 로켓와우클럽</span><span>🥬 로켓프레시</span><span>🌏 해외직구</span><span>🔥 오늘의 특가</span></div></div>`}
 function tabs(){return `<div class="cp-tabbar"><span onclick="cpShow('home')"><b>⌂</b>${txt('홈','首页')}</span><span onclick="cpShow('cart')"><b>🛒</b>${txt('장바구니','购物车')} ${cart.length?`(${cart.reduce((a,x)=>a+x.qty,0)})`:''}</span><span onclick="cpShow('orders')"><b>▤</b>${txt('마이쿠팡','我的Coupang')}</span></div>`}
 function card(p){return `<div class="cp-card"><div class="cp-art" onclick="cpDetail('${p.id}')">${p.emoji||'📦'}</div><div class="cp-info" onclick="cpDetail('${p.id}')"><h3>${E(p.name)}</h3><div class="cp-rate">⭐ ${p.rating} (${Number(p.reviews).toLocaleString()})</div>${p.oldPrice?`<div class="cp-old">${won(p.oldPrice)}</div>`:''}<div class="cp-price">${won(p.price)}</div><span class="cp-tag">🚀 로켓배송</span><div class="cp-muted">${E(p.stock||'내일 도착')}</div></div><button class="cp-btn light" style="align-self:flex-end;padding:8px 10px" onclick="cpQuickAdd('${p.id}')">담기</button></div>`}
 function home(q=''){page='home';let list=products().filter(p=>(category==='전체'||p.category===category)&&(!q||(p.name+p.category).toLowerCase().includes(q.toLowerCase())));root().innerHTML=header()+`<div class="cp-content"><div class="cp-hero"><div class="cp-rocket">🚀 로켓배송 · 로켓와우클럽</div><h2 style="margin:7px 0;font-size:21px">${txt('오늘 주문하면 내일 도착','今天下单，明天送达')}</h2><div class="cp-muted">${txt('30일 무료반품 · 빠르고 편리한 쇼핑','30天免费退货 · 快捷便利购物')}</div></div><b>${txt('카테고리','分类')}</b><div class="cp-chips">${CP.categories.map(c=>`<button class="cp-chip ${c===category?'active':''}" onclick="cpCategorySet('${c}')">${c}</button>`).join('')}</div><div style="display:flex;justify-content:space-between;margin:4px 0 12px"><b>${q?txt('검색 결과','搜索结果'):txt('지금 많이 찾는 상품','热门商品')}</b><span class="cp-muted">${list.length}${txt('개 상품','件商品')}</span></div>${list.length?list.map(card).join(''):`<div class="cp-panel">${txt('검색 결과가 없습니다','没有找到相关商品')}</div>`}</div>`+tabs()}
 window.cpCategorySet=c=>{category=c;home($id('cpSearch')?.value||'')};window.cpSearchRender=q=>home(q);
 window.cpShow=function(p){if(p==='home')home();else if(p==='cart')cartPage();else if(p==='orders')ordersPage();else if(p==='checkout')checkout();else if(p==='detail'&&product)detail(product.id)};
 window.cpDetail=function(id){product=getProd(id);if(!product)return;qty=1;option=product.option||'';detail(id)};
 function detail(id){product=getProd(id);page='detail';root().innerHTML=header()+`<div class="cp-content"><button class="cp-btn light" onclick="cpShow('home')">‹ ${txt('홈으로','返回首页')}</button><div class="cp-panel" style="margin-top:10px"><div class="cp-art" style="width:100%;height:205px;font-size:84px">${product.emoji||'📦'}</div><h2 style="font-size:19px;line-height:1.4">${E(product.name)}</h2><div class="cp-rate">⭐ ${product.rating} (${Number(product.reviews).toLocaleString()} ${txt('개 상품평','条评价')})</div><div class="cp-price">${won(product.price)}</div><span class="cp-tag">🚀 로켓배송</span><p class="cp-muted">🚚 ${E(product.stock||'내일 도착')}<br>↩️ 30일 무료반품</p><label class="cp-label">${txt('옵션 선택','选择规格')}</label><select class="cp-input" onchange="cpOptionSet(this.value)" style="margin-top:7px">${[product.option||'기본',...(product.id==='cp4'?['220','225','230','235','240','245','250','255','260']:[])].map(o=>`<option ${o===option?'selected':''}>${E(o)}</option>`).join('')}</select><div class="cp-row"><span>${txt('수량','数量')}</span><div class="cp-count"><button onclick="cpQtyChange(-1)">−</button><b id="cpQty">${qty}</b><button onclick="cpQtyChange(1)">＋</button></div></div></div><div style="display:flex;gap:8px"><button class="cp-btn light" style="flex:1" onclick="cpAddCart(false)">${txt('장바구니 담기','加入购物车')}</button><button class="cp-btn" style="flex:1" onclick="cpAddCart(true)">${txt('구매하기','立即购买')}</button></div></div>`+tabs()}
 window.cpOptionSet=v=>option=v;window.cpQtyChange=d=>{qty=Math.max(1,qty+d);if($id('cpQty'))$id('cpQty').textContent=qty};
 window.cpQuickAdd=id=>{product=getProd(id);qty=1;option=product.option;addCart(false)};
 window.cpAddCart=buy=>addCart(buy);
 function addCart(buy){if(!product)return;let it=cart.find(x=>x.id===product.id&&x.option===option);if(it)it.qty+=qty;else cart.push({id:product.id,name:product.name,price:product.price,qty,option,emoji:product.emoji});qty=1;if(buy)checkout();else{home();toast(txt('장바구니에 담았습니다','已加入购物车'))}}
 function cartPage(){page='cart';root().innerHTML=header()+`<div class="cp-content"><h2>${txt('장바구니','购物车')}</h2>${cart.length?cart.map((it,i)=>`<div class="cp-panel"><div style="display:flex;gap:10px"><input type="checkbox" checked><div class="cp-art" style="width:68px;min-width:68px;height:78px">${it.emoji||'📦'}</div><div class="cp-info"><b style="font-size:14px">${E(it.name)}</b><div class="cp-muted">${txt('옵션','规格')}: ${E(it.option)}</div><div class="cp-price">${won(it.price)}</div><div class="cp-count"><button onclick="cpCartQty(${i},-1)">−</button><b>${it.qty}</b><button onclick="cpCartQty(${i},1)">＋</button><button class="cp-btn light" style="padding:6px" onclick="cpRemove(${i})">${txt('삭제','删除')}</button></div></div></div></div>`).join(''):`<div class="cp-panel" style="text-align:center;padding:30px">${txt('장바구니가 비어 있어요','购物车是空的')}<p><button class="cp-btn" onclick="cpShow('home')">${txt('쇼핑 계속하기','继续购物')}</button></p></div>`}<div class="cp-panel"><div class="cp-row"><span>${txt('상품 합계','商品合计')}</span><b>${won(total())}</b></div><div class="cp-row"><span>${txt('배송비','配送费')}</span><b>${won(0)}</b></div><div class="cp-row"><b>${txt('총 결제금액','应付总额')}</b><b class="cp-price">${won(total())}</b></div></div><div class="cp-bottom"><div style="flex:1"><small class="cp-muted">${txt('총 결제금액','应付总额')}</small><div class="cp-price">${won(total())}</div></div><button class="cp-btn" style="flex:1" onclick="cpShow('checkout')">${txt('주문/결제','下单/结算')}</button></div></div>`+tabs()}
 window.cpCartQty=(i,d)=>{if(cart[i])cart[i].qty=Math.max(1,cart[i].qty+d);cartPage()};window.cpRemove=i=>{cart.splice(i,1);cartPage()};

      <div style="position:absolute;top:calc(var(--top)+8px);right:16px;font-size:13px;z-index:5;text-align:right" id="sheepHUD"></div>
      <canvas id="sheepCV" style="width:100%;height:100%;display:block;background:linear-gradient(#1a1a3a,#0a0a18)"></canvas>
      <div id="sheepFever" style="display:none;position:absolute;inset:0;background:rgba(0,0,0,.78);z-index:10;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center">
        <div style="font-size:20px;margin-bottom:12px">🌙 Fever Time</div>
        <div id="sheepSecret" style="font-size:16px;line-height:1.5;max-width:280px;margin-bottom:20px"></div>
        <button style="padding:10px 28px;border:0;border-radius:10px;background:#7c5cff;color:#fff;font-weight:700" onclick="document.getElementById('sheepFever').style.display='none'">OK</button>
      </div>`;
    const cv = document.getElementById('sheepCV');
    const ctx = cv.getContext('2d');
    function resize(){const dpr=window.devicePixelRatio||1;cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
    resize();
    const onResize=()=>resize(); window.addEventListener('resize', onResize);
    sheepTimers.push({__type:'resize', fn:()=>window.removeEventListener('resize', onResize)});
    const W=()=>cv.clientWidth, H=()=>cv.clientHeight;
    function jump(){if(onGround&&sheepRunning){vy=-11;onGround=false;}}
    cv.onclick=jump;
    const kd=e=>{if(e.code==='Space'){e.preventDefault();jump();}};
    window.addEventListener('keydown', kd);
    sheepTimers.push({__type:'kd', fn:()=>window.removeEventListener('keydown', kd)});
    function spawnObs(){
      if(!sheepRunning)return;
      obstacles.push({x:W()+20, type:['☕','⏰','🚧'][Math.floor(Math.random()*3)], w:36});
      sheepTimers.push(setTimeout(spawnObs, 1100+Math.random()*1000/speed));
    }
    function spawnSheep(){
      if(!sheepRunning)return;
      sheeps.push({x:W()+10, y:H()*0.55+Math.random()*40});
      sheepTimers.push(setTimeout(spawnSheep, 800+Math.random()*700));
    }
    sheepTimers.push(setTimeout(spawnObs, 900));
    sheepTimers.push(setTimeout(spawnSheep, 600));
    const tick = setInterval(()=>{
      if(!sheepRunning)return;
      timeLeft--;
      if(timeLeft<=0){endGame();return;}
      const hud=document.getElementById('sheepHUD');
      if(hud) hud.innerHTML = `${ko?'남은 시간':'剩余时间'} 0:${String(timeLeft).padStart(2,'0')} · ${ko?'점수':'分数'} ${score}<br><div style="margin-top:4px;height:8px;background:#333;border-radius:4px;overflow:hidden;width:120px;margin-left:auto"><div style="height:100%;width:${sleep}%;background:linear-gradient(90deg,#7c5cff,#a78bfa)"></div></div>`;
    },1000);
    sheepTimers.push(tick);
    function loop(){
      if(!sheepRunning)return;
      const w=W(), h=H();
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle='#2a2a4a'; ctx.fillRect(0,h*0.72,w,h*0.28);
      vy+=0.55; playerY+=vy;
      if(playerY>=0){playerY=0;vy=0;onGround=true;}
      const px=w*0.18, py=h*0.72-48+playerY;
      ctx.font='36px serif'; ctx.fillText(playerEmoji, px, py);
      for(let i=obstacles.length-1;i>=0;i--){
        const o=obstacles[i]; o.x-=3.4*speed;
        ctx.font='28px serif'; ctx.fillText(o.type, o.x, h*0.72-8);
        if(o.x<px+40&&o.x+o.w>px&&py>h*0.72-60){sleep=Math.max(0,sleep-12);obstacles.splice(i,1);}
        else if(o.x<-50) obstacles.splice(i,1);
      }
      for(let i=sheeps.length-1;i>=0;i--){
        const s=sheeps[i]; s.x-=2.5*speed;
        ctx.font='30px serif'; ctx.fillText('🐑', s.x, s.y);
        if(s.x<px+40&&s.x+30>px&&Math.abs(py-s.y)<50){
          score+=10; sleep=Math.min(100,sleep+8); sheeps.splice(i,1);
          if(sleep>=100&&!fever){
            fever=true; speed=2.8;
            const sec=SECRETS[char];
            const fe=document.getElementById('sheepFever');
            const fs=document.getElementById('sheepSecret');
            if(fs) fs.textContent=txg(sec);
            if(fe) fe.style.display='flex';
          }
        } else if(s.x<-40) sheeps.splice(i,1);
      }
      sheepRAF=requestAnimationFrame(loop);
    }
    loop();
    function endGame(){
      clearSheepTimers();
      // ranking: heroine (CONFIG.userName) + 6 characters, shuffled
      const me = meName();
      const pool = [
        {name: me, emoji: '⭐', score: score},
        ...Object.keys(CHAR_EMOJI).map(n=>({name:n, emoji:CHAR_EMOJI[n], score: Math.floor(Math.random()*Math.max(score+30,40))}))
      ];
      // shuffle order for rank display (heroine rank random 1-7 by shuffling)
      for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
      // sort by score desc for ranking
      pool.sort((a,b)=>b.score-a.score);
      // ensure uniqueness of scores slightly
      pool.forEach((p,i)=>{ if(i>0 && p.score>=pool[i-1].score) p.score=Math.max(0,pool[i-1].score-Math.floor(Math.random()*5)-1); });
      pool.sort((a,b)=>b.score-a.score);
      const rankRows = pool.map((p,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:${p.name===me?'rgba(124,92,255,.25)':'rgba(255,255,255,.06)'};border-radius:10px;margin:4px 0">
        <b style="width:24px;text-align:center">${i+1}</b>
        <span style="font-size:22px">${p.emoji}</span>
        <span style="flex:1;text-align:left;font-weight:${p.name===me?700:500}">${p.name}</span>
        <span style="opacity:.85">${p.score}</span>
      </div>`).join('');
      const myRank = pool.findIndex(p=>p.name===me)+1;
      R.innerHTML = `<div style="position:absolute;top:var(--top);left:16px;font-size:24px;cursor:pointer" onclick="OPEN.sheep()">←</div>
        <div style="padding:calc(var(--top) + 36px) 16px 24px;width:100%;max-width:360px;margin:0 auto;box-sizing:border-box">
          <div style="font-size:22px;font-weight:800;margin-bottom:6px">${ko?'게임 종료':'游戏结束'}</div>
          <div style="font-size:40px;font-weight:800;margin:8px 0">${score}</div>
          <div style="font-size:13px;opacity:.75;margin-bottom:14px">${ko?`내 순위 ${myRank}위`:`我的排名 第${myRank}名`}</div>
          <div style="font-size:14px;font-weight:700;margin-bottom:8px;opacity:.9">${ko?'랭킹':'排名'}</div>
          ${rankRows}
          <div style="display:flex;gap:10px;margin-top:18px;justify-content:center;flex-wrap:wrap">
            <button style="padding:12px 22px;border:0;border-radius:12px;background:#7c5cff;color:#fff;font-weight:700" onclick="startSheepGame('${char}')">${ko?'다시 플레이':'重新游玩'}</button>
            <button style="padding:12px 22px;border:0;border-radius:12px;background:#333;color:#fff;font-weight:700" onclick="go('home')">${ko?'뒤로 가기':'返回'}</button>
          </div>
        </div>`;
    }
  }
  // expose clear for external
  window.clearSheepTimers = clearSheepTimers;
})();



/* Adaptive music deep-link: Spotify app → QQ Music app → web */
window.openMusicTrack = function(title, artist){
  const q = encodeURIComponent((title||'') + ' ' + (artist||'')).trim();
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  const spApp = 'spotify:search:' + q;
  const qqApp = 'qqmusic://qq.com/ui/search?key=' + q;
  const spWeb = 'https://open.spotify.com/search/' + q;
  const qqWeb = 'https://y.qq.com/n/ryqq/search?w=' + q;
  if(isMobile){
    // try Spotify scheme then QQ Music
    const a = document.createElement('a');
    a.href = spApp;
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{
      try{ window.location.href = qqApp; }catch(e){}
      setTimeout(()=>{
        // fallback toast
        if(typeof toast==='function') toast(L==='zh'?'请手动打开 Spotify 或 QQ音乐 播放':'Spotify 또는 QQ뮤직 앱을 직접 열어 주세요');
      }, 1200);
    }, 800);
  } else {
    // PC: open Spotify web, fallback QQ
    const w = window.open(spWeb, '_blank');
    if(!w){
      window.open(qqWeb, '_blank');
    }
  }
};
